<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} – BeaverTracer</title>
  <link rel="icon" href="/beaver-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../_style.css">
  <link rel="stylesheet" href="../fa/css/all.min.css">
  <script>
  (function(){
    var s = localStorage.getItem('bt-lesson-theme');
    var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = s || sys;
  })();
  </script>
</head>
<body>
  <header class="lesson-header">
    <div class="lesson-header-inner">
      <a href="../../" class="lesson-header-logo" target="_blank">
        <img src="../../beaver.svg" alt="BeaverTracer" width="28" height="28">
        BeaverTracer
      </a>
<button class="theme-toggle" id="themeToggle" aria-label="Hell/Dunkel" title="Hell/Dunkel wechseln"><span class="theme-icon"></span></button>
    </div>
  </header>
  <div class="lesson-layout">
    <details class="lesson-sidebar-details" open>
      <summary>Inhaltsverzeichnis</summary>
      <nav class="lesson-sidebar" aria-label="Lektionen">
        {{sidebar}}
      </nav>
    </details>
    <main class="lesson-main">
      <div class="wip-banner" role="alert">
        <strong>🚧 Lektionen in Bearbeitung</strong> — Diese Seiten sind noch nicht vollständig. Inhalte können fehlen, unvollständig oder noch nicht korrekturgelesen sein.
      </div>
      <article class="lesson-article">
        {{body}}
      </article>
    </main>
  </div>
  <footer class="lesson-footer">
    BeaverTracer – Netzwerksimulation für den Unterricht
  </footer>
  <script>
  (function(){
    var btn = document.getElementById('themeToggle');
    var icon = btn.querySelector('.theme-icon');
    function upd() { icon.textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙'; }
    upd();
    btn.addEventListener('click', function() {
      var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('bt-lesson-theme', next);
      upd();
    });
  })();
  </script>
</body>
</html>
