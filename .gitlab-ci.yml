# .gitlab-ci.yml
#
# Builds:
#  - on branch "development": typecheck + web build (dist/)
#  - on tags v*.*.*        : web build + Tauri (Linux/Windows) + GitLab Release (stable)
#  - on tags v*.*.*-<pre>  : web build + Tauri (Linux/Windows) + GitLab Release (pre-release)
#
# Tag conventions (SemVer):
#   v0.1.17          stable release
#   v1.0.0-rc.1      pre-release  (rc, beta, alpha, …)
#
# Einmalige Einrichtung:
#  - Project Access Token mit Scope "api" als CI-Variable RELEASE_TOKEN hinterlegen
#    (Settings → CI/CD → Variables)
#  - Linux-Runner mit Docker-Executor nötig (für alle Jobs)

stages:
  - check
  - build
  - release

variables:
  # Vollständiger Clone damit git describe funktioniert
  GIT_DEPTH: 0
  # Cargo-Cache ins Projektverzeichnis (Runner-Cache greift dann)
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

# ── Tag-Regexe ────────────────────────────────────────────────────────────────
# Stable:      v1.2.3
# Pre-release: v1.2.3-rc.1  v1.2.3-beta.2  v1.2.3-alpha.1  …
# Any release: both of the above (used for build + upload jobs)

.rule-stable:    &rule-stable    '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
.rule-prerelease: &rule-prerelease '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z]/'
.rule-any-release: &rule-any-release '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

# ── Shared defaults (Web-Jobs) ────────────────────────────────────────────────

default:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - node -v && npm -v
    - npm ci --cache .npm --prefer-offline

# ── Shared setup für Tauri-Jobs (Linux/Windows) ───────────────────────────────

.tauri-setup:
  image: node:22-bookworm
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq
        curl file libssl-dev pkg-config
        libwebkit2gtk-4.1-dev libgtk-3-dev
        libayatana-appindicator3-dev librsvg2-dev patchelf
        llvm clang nsis
    - |
      if ! command -v rustup &>/dev/null; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      fi
    - source "$CARGO_HOME/env"
    - npm ci --cache .npm --prefer-offline
  cache:
    - key:
        files:
          - package-lock.json
      paths:
        - .npm/
    - key: "cargo-$CI_JOB_NAME"
      paths:
        - .cargo/registry/
        - .cargo/git/
        - src-tauri/target/

# ── check ─────────────────────────────────────────────────────────────────────

typecheck:
  stage: check
  script:
    - npx tsc --noEmit
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
    - if: *rule-any-release
    - when: never

test:
  stage: check
  script:
    - npm test
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
    - if: *rule-any-release
    - when: never

# ── build ─────────────────────────────────────────────────────────────────────

# Web-Build für Deployment auf beavertracer.eu
build_dev:
  stage: build
  script:
    - npm run build
  artifacts:
    expire_in: 1 day
    paths:
      - dist/
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
    - when: never

# Web-Build für Release (sync-version läuft automatisch in prebuild)
build_release:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
  rules:
    - if: *rule-any-release

# Tauri – Linux (AppImage + .deb)
tauri:linux:
  stage: build
  extends: .tauri-setup
  rules:
    - if: *rule-any-release
  script:
    - node scripts/set-tauri-version.mjs
    # Bundle-Output aus dem Cargo-Cache leeren, sonst sammeln sich hier
    # Bundles aller bisherigen Releases an (Cache-Key ist nicht versionsspezifisch)
    - rm -rf src-tauri/target/release/bundle
    - npm run tauri:build
  artifacts:
    name: tauri-linux
    paths:
      - src-tauri/target/release/bundle/appimage/*.AppImage
      - src-tauri/target/release/bundle/deb/*.deb
    expire_in: 1 day

# Tauri – Windows via cargo-xwin (Cross-Compilation von Linux aus)
tauri:windows:
  stage: build
  extends: .tauri-setup
  rules:
    - if: *rule-any-release
  script:
    - node scripts/set-tauri-version.mjs
    - ln -sf "$(which makensis)" /usr/local/bin/makensis.exe
    - rustup target add x86_64-pc-windows-msvc
    - cargo install cargo-xwin
    # Bundle-Output aus dem Cargo-Cache leeren, sonst sammeln sich hier
    # Bundles aller bisherigen Releases an (Cache-Key ist nicht versionsspezifisch)
    - rm -rf src-tauri/target/x86_64-pc-windows-msvc/release/bundle
    - npm run tauri:win
  artifacts:
    name: tauri-windows
    paths:
      - src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    expire_in: 1 day


# ── release ───────────────────────────────────────────────────────────────────

# Job 1: Artifacts in Package Registry hochladen, VERSION exportieren
upload:
  stage: release
  image: alpine:latest
  needs:
    - job: tauri:linux
      artifacts: true
    - job: tauri:windows
      artifacts: true
  rules:
    - if: *rule-any-release
  before_script:
    - apk add --no-cache curl
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - PKG="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/beavertracer/${VERSION}"
    - echo "VERSION=$VERSION" > release.env
    - echo "DL_BASE=https://www.beavertracer.eu/releases" >> release.env
    - |
      for f in \
        src-tauri/target/release/bundle/appimage/*.AppImage \
        src-tauri/target/release/bundle/deb/*.deb \
        src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe; do
        [ -f "$f" ] || continue
        echo "Uploading $(basename "$f") ..."
        curl --fail --silent \
             --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$f" \
             "${PKG}/$(basename "$f")"
      done
  artifacts:
    reports:
      dotenv: release.env

# Job 2a: GitLab Release für stabile Versionen
release:stable:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  needs:
    - job: upload
      artifacts: true
  rules:
    - if: *rule-stable
  script:
    - echo "Creating stable release for $CI_COMMIT_TAG"
  release:
    name: "Beaver Tracer $CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    description: |
      ## Beaver Tracer $CI_COMMIT_TAG

      Desktop-Downloads: https://www.beavertracer.eu
    assets:
      links:
        - name: "Linux AppImage"
          url: "$DL_BASE/beavertracer_${VERSION}_amd64.AppImage"
          link_type: package
        - name: "Linux .deb"
          url: "$DL_BASE/beavertracer_${VERSION}_amd64.deb"
          link_type: package
        - name: "Windows Installer (.exe)"
          url: "$DL_BASE/beavertracer_${VERSION}_x64-setup.exe"
          link_type: package

# Job 2b: GitLab Release für Pre-release-Versionen (rc, beta, alpha, …)
release:prerelease:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  needs:
    - job: upload
      artifacts: true
  rules:
    - if: *rule-prerelease
  script:
    - echo "Creating pre-release for $CI_COMMIT_TAG"
  release:
    name: "Beaver Tracer $CI_COMMIT_TAG (Pre-release)"
    tag_name: "$CI_COMMIT_TAG"
    description: |
      ## Beaver Tracer $CI_COMMIT_TAG (Pre-release)

      Desktop-Downloads: https://www.beavertracer.eu
    assets:
      links:
        - name: "Linux AppImage"
          url: "$DL_BASE/beavertracer_${VERSION}_amd64.AppImage"
          link_type: package
        - name: "Linux .deb"
          url: "$DL_BASE/beavertracer_${VERSION}_amd64.deb"
          link_type: package
        - name: "Windows Installer (.exe)"
          url: "$DL_BASE/beavertracer_${VERSION}_x64-setup.exe"
          link_type: package
