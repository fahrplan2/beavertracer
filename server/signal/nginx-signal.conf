# Signaling für die WebRTC-Brücke unter www.beavertracer.eu/signal/
# Einbinden im server-Block von beavertracer.eu:
#   include /opt/beavertracer-signal/nginx-signal.conf;
location /signal/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    # Nginx Proxy Manager setzt X-Real-IP auf die echte Client-Adresse;
    # der Dienst braucht sie nur fürs Rate-Limit (bleibt max. 1 min im RAM).
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header Connection "";
    proxy_buffering off;
    # Long-Poll hält Anfragen bis 25 s offen
    proxy_read_timeout 60s;
    client_max_body_size 8k;
    access_log off;
}
